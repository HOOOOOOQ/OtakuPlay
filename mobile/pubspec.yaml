name: otakuplay
description: "OtakuPlay - Your Anime. Your Community. Your Universe."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  cached_network_image: ^3.4.1
  socket_io_client: ^3.0.2
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  video_player: ^2.9.3
  chewie: ^1.10.0
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  intl: ^0.20.2
  share_plus: ^10.1.4
  google_fonts: ^6.2.1
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env.example
    - assets/logos/
    - assets/banners/
    - assets/avatars/
    - assets/illustrations/
