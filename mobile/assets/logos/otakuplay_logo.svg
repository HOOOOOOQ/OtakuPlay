    />
  </g>

  <!-- OTAKUPLAY Wordmark -->
  <text
    x="312"
    y="186"
    font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"
    font-size="116"
    font-weight="800"
    letter-spacing="10"
    fill="url(#logoTextGrad)"
  >OTAKU<tspan fill="#A78BFA">PLAY</tspan></text>

  <!-- Subtle futuristic accent underline -->
  <rect x="316" y="212" width="160" height="6" rx="3" fill="#8B5CF6" />
  <rect x="488" y="212" width="44" height="6" rx="3" fill="#C084FC" opacity="0.7" />
