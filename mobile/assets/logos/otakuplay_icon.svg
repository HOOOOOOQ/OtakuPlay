<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="opGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="opGradPlay" x1="15%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E9D5FF" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <filter id="violetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer stylized 'O' ring with futuristic cyber cut -->
  <g filter="url(#violetGlow)">
    <path
      d="M 512 132
         A 380 380 0 1 1 206 286
         L 286 350
         A 278 278 0 1 0 512 234 Z"
      fill="url(#opGradMain)"
    />
    <!-- Dynamic accent arc completing the O silhouette -->
    <path
      d="M 250 232
         A 380 380 0 0 1 464 135
         L 476 237
         A 278 278 0 0 0 326 306 Z"
      fill="#C084FC"
      opacity="0.92"
    />
  </g>

  <!-- Centered Play Symbol fused inside the O -->
  <path
    d="M 436 338
       C 436 314 462 300 483 312
       L 726 484
       C 746 498 746 526 726 540
       L 483 712
       C 462 724 436 710 436 686 Z"
    fill="url(#opGradPlay)"
  />
</svg>
